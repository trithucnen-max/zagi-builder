name: 🍎 macOS Build (Manual — Local Only)
# ─── KHÔNG TỰ ĐỘNG TRIGGER ───────────────────────────────────────────────────
# macOS phải build LOCAL bằng lệnh: bash build-mac.sh
# (Cần Apple Developer ID: BASAN CORPORATION JFT5TLZ3HK)
# Sau đó upload file DMG lên GitHub Release thủ công.
#
# File này chỉ là tài liệu hướng dẫn quy trình, KHÔNG được kích hoạt trên CI.
# ─────────────────────────────────────────────────────────────────────────────

on:
  # Không trigger tự động — chỉ cho phép chạy thủ công nếu cần debug
  workflow_dispatch:
    inputs:
      confirm:
        description: "Xác nhận build macOS trên CI (không có signing — CHỈ dùng để debug)"
        required: true
        default: "no"
        type: choice
        options:
          - "no"
          - "yes_debug_only"

jobs:
  notice:
    runs-on: ubuntu-latest
    steps:
      - name: ⚠️ macOS build thực hiện LOCAL
        run: |
          echo "==========================================================="
          echo "  macOS PHẢI BUILD LOCAL bằng: bash build-mac.sh"
          echo "  (Apple Developer ID: BASAN CORPORATION JFT5TLZ3HK)"
          echo ""
          echo "  Quy trình:"
          echo "  1. git pull để lấy code mới nhất"
          echo "  2. bash build-mac.sh"
          echo "  3. Upload 2 file DMG lên GitHub Release:"
          echo "     - Zagi v<version> MacOS Intel.dmg"
          echo "     - Zagi v<version> MacOS M1+ arm64.dmg"
          echo "==========================================================="
          exit 0
