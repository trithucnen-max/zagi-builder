name: Release Zagi Native Rust

on:
  push:
    tags:
      - 'v*.*.*-rust*'
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: zagi-macos-arm64
          - os: macos-13
            target: x86_64-apple-darwin
            artifact_name: zagi-macos-x64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: zagi-windows-x64.exe
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            artifact_name: zagi-linux-x64

    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux Dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Cargo Test
        run: cargo test --workspace

      - name: Cargo Build Release
        run: cargo build --release --target ${{ matrix.target }}

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            target/${{ matrix.target }}/release/zagi
            target/${{ matrix.target }}/release/zagi.exe
            target/${{ matrix.target }}/release/zagi-desktop
            target/${{ matrix.target }}/release/zagi-desktop.exe
