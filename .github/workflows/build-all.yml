# ─── Build Zagi — Windows x64 + Windows ARM64 (Surface) + macOS + Linux ─────────
# CI/CD tổng hợp: trigger tự động khi push tag v*, chạy song song 4 job
# Publish lên cùng 1 GitHub Release kèm release notes tự động từ CHANGELOG.md
# ─────────────────────────────────────────────────────────────────────────────

name: 🚀 Build All Platforms

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  # Tự động trigger khi push tag vX.X.X (từ git push origin vX.X.X)
  push:
    tags:
      - 'v*'

  # Kích hoạt thủ công qua GitHub Actions UI
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag cho release (vd: v27.2.4). Bỏ trống = tự lấy từ package.json'
        required: false
        default: ''
        type: string
      publish:
        description: 'Publish lên GitHub Releases?'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

# ─── SECRETS cần cấu hình ────────────────────────────────────────────────────
#   GH_TOKEN — GitHub Personal Access Token (repo scope) — dùng cho electron-builder
#   GITHUB_TOKEN — tự động có sẵn trong GitHub Actions
# ─────────────────────────────────────────────────────────────────────────────

jobs:
  # ═══════════════════════════════════════════════════════════════════════════
  # Resolve tag + trích xuất release notes từ CHANGELOG.md
  # ═══════════════════════════════════════════════════════════════════════════
  resolve-tag:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.get_tag.outputs.tag }}
      version: ${{ steps.get_tag.outputs.version }}
      should_publish: ${{ steps.get_tag.outputs.should_publish }}
      release_notes: ${{ steps.get_notes.outputs.notes }}
    steps:
      - uses: actions/checkout@v4

      - name: 🏷️ Resolve tag & version
        id: get_tag
        shell: bash
        run: |
          SHOULD_PUBLISH="false"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG="${GITHUB_REF_NAME}"
            SHOULD_PUBLISH="true"
          elif [ -n "${{ github.event.inputs.tag_name }}" ]; then
            TAG="${{ github.event.inputs.tag_name }}"
            SHOULD_PUBLISH="${{ github.event.inputs.publish }}"
          else
            VERSION=$(node -p "require('./package.json').version")
            TAG="v${VERSION}"
            SHOULD_PUBLISH="${{ github.event.inputs.publish }}"
          fi
          VERSION="${TAG#v}"
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "should_publish=${SHOULD_PUBLISH}" >> $GITHUB_OUTPUT
          echo "✅ Tag: ${TAG} | Version: ${VERSION} | Publish: ${SHOULD_PUBLISH}"

      - name: 📝 Extract release notes from CHANGELOG.md
        id: get_notes
        shell: bash
        run: |
          TAG="${{ steps.get_tag.outputs.tag }}"
          VERSION="${{ steps.get_tag.outputs.version }}"
          # Trích đoạn CHANGELOG từ [vX.X.X] đến [vX.X.X] tiếp theo
          NOTES=$(awk "/^## \[${VERSION}\]/{found=1; next} found && /^## \[/{exit} found{print}" CHANGELOG.md 2>/dev/null || echo "")
          if [ -z "$NOTES" ]; then
            NOTES="Xem [CHANGELOG đầy đủ](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md) để biết chi tiết."
          fi
          # Ghi ra file để tránh lỗi multiline trong GITHUB_OUTPUT
          echo "$NOTES" > /tmp/release_notes.md
          {
            echo 'notes<<RELEASE_NOTES_EOF'
            cat /tmp/release_notes.md
            echo 'RELEASE_NOTES_EOF'
          } >> $GITHUB_OUTPUT
          echo "✅ Release notes extracted ($(wc -l < /tmp/release_notes.md) lines)"

  # ═══════════════════════════════════════════════════════════════════════════
  # Windows x64 — PC thường, laptop Intel/AMD
  # ═══════════════════════════════════════════════════════════════════════════
  build-windows-x64:
    needs: resolve-tag
    runs-on: windows-latest
    timeout-minutes: 40

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: 🟢 Setup Go (stable)
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          cache: false

      - name: 📦 Install npm dependencies
        run: npm ci --legacy-peer-deps

      - name: 🏗️ Build E2EE bridge (Go)
        run: npm run build:bridge-e2ee

      - name: 🏗️ Compile TypeScript (Electron main)
        run: npx tsc -p tsconfig.electron.prod.json

      - name: 🧹 Strip console.* từ dist-electron (production)
        run: node scripts/strip-console.js

      - name: 🏗️ Build renderer (Vite)
        run: npx vite build
        env:
          NODE_ENV: production
          BUILD_TARGET: production

      - name: 📦 Build Windows installer (x64)
        run: npx electron-builder --win --x64 --publish never

      - name: 🚀 Upload Windows x64 → GitHub Release
        if: needs.resolve-tag.outputs.should_publish == 'true'
        uses: softprops/action-gh-release@v2
        with:
          repository: ${{ github.repository }}
          tag_name: ${{ needs.resolve-tag.outputs.tag }}
          name: "🎉 Zagi ${{ needs.resolve-tag.outputs.tag }}"
          body: ${{ needs.resolve-tag.outputs.release_notes }}
          files: |
            dist-electron-build/Zagi-Setup-*-x64.exe
            dist-electron-build/Zagi-Setup-*-x64.exe.blockmap
            dist-electron-build/latest.yml
          token: ${{ secrets.GITHUB_TOKEN }}
          draft: false
          prerelease: false
          make_latest: false
          fail_on_unmatched_files: false

  # ═══════════════════════════════════════════════════════════════════════════
  # Windows ARM64 — Surface Pro X / Pro 9 5G / Pro 10 / Pro 11 / Laptop 7
  # ═══════════════════════════════════════════════════════════════════════════
  build-windows-arm64:
    needs: resolve-tag
    runs-on: windows-latest
    timeout-minutes: 40

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: 🟢 Setup Go (stable)
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          cache: false

      - name: 📦 Install npm dependencies
        run: npm ci --legacy-peer-deps

      - name: 🏗️ Build E2EE bridge (Go)
        run: npm run build:bridge-e2ee

      - name: 🏗️ Compile TypeScript (Electron main)
        run: npx tsc -p tsconfig.electron.prod.json

      - name: 🧹 Strip console.* từ dist-electron (production)
        run: node scripts/strip-console.js

      - name: 🏗️ Build renderer (Vite)
        run: npx vite build
        env:
          NODE_ENV: production
          BUILD_TARGET: production

      - name: 📦 Build Windows installer (ARM64 — Surface)
        run: npx electron-builder --win --arm64 --publish never

      - name: 🚀 Upload Windows ARM64 → GitHub Release
        if: needs.resolve-tag.outputs.should_publish == 'true'
        uses: softprops/action-gh-release@v2
        with:
          repository: ${{ github.repository }}
          tag_name: ${{ needs.resolve-tag.outputs.tag }}
          name: "🎉 Zagi ${{ needs.resolve-tag.outputs.tag }}"
          body: ${{ needs.resolve-tag.outputs.release_notes }}
          files: |
            dist-electron-build/Zagi-Setup-*-arm64.exe
            dist-electron-build/Zagi-Setup-*-arm64.exe.blockmap
          token: ${{ secrets.GITHUB_TOKEN }}
          draft: false
          prerelease: false
          make_latest: false
          fail_on_unmatched_files: false

  # ═══════════════════════════════════════════════════════════════════════════
  # macOS (x64 Intel + arm64 Apple Silicon) — build trên macos-14 (M1 runner)
  # ═══════════════════════════════════════════════════════════════════════════
  build-macos:
    needs: resolve-tag
    runs-on: macos-14
    timeout-minutes: 40

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: 🟢 Setup Go (stable)
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          cache: false

      - name: 📦 Install npm dependencies
        run: npm ci --legacy-peer-deps

      - name: 🏗️ Build E2EE bridge (Go)
        run: npm run build:bridge-e2ee

      - name: 🏗️ Compile TypeScript (Electron main)
        run: npx tsc -p tsconfig.electron.prod.json

      - name: 🧹 Strip console.* từ dist-electron (production)
        run: node scripts/strip-console.js

      - name: 🏗️ Build renderer (Vite)
        run: npx vite build
        env:
          NODE_ENV: production
          BUILD_TARGET: production

      - name: 📦 Build macOS app (x64 + arm64)
        run: npx electron-builder --mac --x64 --arm64 --publish never
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: 🚀 Upload macOS → GitHub Release
        if: needs.resolve-tag.outputs.should_publish == 'true'
        uses: softprops/action-gh-release@v2
        with:
          repository: ${{ github.repository }}
          tag_name: ${{ needs.resolve-tag.outputs.tag }}
          name: "🎉 Zagi ${{ needs.resolve-tag.outputs.tag }}"
          body: ${{ needs.resolve-tag.outputs.release_notes }}
          files: |
            dist-electron-build/*.dmg
            dist-electron-build/*.dmg.blockmap
            dist-electron-build/latest-mac.yml
          token: ${{ secrets.GITHUB_TOKEN }}
          draft: false
          prerelease: false
          make_latest: true
          fail_on_unmatched_files: false

  # ═══════════════════════════════════════════════════════════════════════════
  # Linux (x64 — AppImage + .deb)
  # ═══════════════════════════════════════════════════════════════════════════
  build-linux:
    needs: resolve-tag
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: 🟢 Setup Go (stable)
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          cache: false

      - name: 📦 Install system dependencies (libfuse2, dpkg-dev)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libfuse2 dpkg-dev || echo 'WARN: some system deps missing'

      - name: 📦 Install npm dependencies
        run: npm ci --legacy-peer-deps

      - name: 🏗️ Build E2EE bridge (Go)
        run: npm run build:bridge-e2ee

      - name: 🏗️ Compile TypeScript (Electron main)
        run: npx tsc -p tsconfig.electron.prod.json

      - name: 🧹 Strip console.* từ dist-electron (production)
        run: node scripts/strip-console.js

      - name: 🏗️ Build renderer (Vite)
        run: npx vite build
        env:
          NODE_ENV: production
          BUILD_TARGET: production

      - name: 📦 Build Linux app (x64 — AppImage + .deb)
        run: npx electron-builder --linux --x64 --publish never

      - name: 🚀 Upload Linux → GitHub Release
        if: needs.resolve-tag.outputs.should_publish == 'true'
        uses: softprops/action-gh-release@v2
        with:
          repository: ${{ github.repository }}
          tag_name: ${{ needs.resolve-tag.outputs.tag }}
          name: "🎉 Zagi ${{ needs.resolve-tag.outputs.tag }}"
          body: ${{ needs.resolve-tag.outputs.release_notes }}
          files: |
            dist-electron-build/*.AppImage
            dist-electron-build/*.deb
            dist-electron-build/latest-linux.yml
          token: ${{ secrets.GITHUB_TOKEN }}
          draft: false
          prerelease: false
          make_latest: false
          fail_on_unmatched_files: false
